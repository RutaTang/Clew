# A workspace for the client/server split: the `clew` client (GUI) and the
# `clew-protocol` crate (the client ↔ clew-server contract). The `clew-server`
# crate joins as the backend is extracted.
[workspace]
members = ["crates/clew-core", "crates/clew-protocol", "crates/clew-server"]

[package]
name = "clew"
version = "0.1.4"
edition = "2024"

[dependencies]
clew-core = { path = "crates/clew-core" }
clew-protocol = { path = "crates/clew-protocol" }
flate2 = "1.1.9"
# NB: no "highlighter" feature. clew highlights code with its own tree-sitter
# pipeline (crates/clew-core/highlight.rs); iced's highlighter is only used by
# `markdown::view` for fenced/indented code blocks, where its syntax theme
# renders the text invisibly on the dark block background (godoc/reST example
# blocks showed as empty black boxes). Without it, iced falls back to plain,
# visible monospace text.
iced = { version = "0.14", features = ["advanced", "canvas", "markdown", "svg", "tokio"] }
lzma-rs = "0.3.0"
notify-debouncer-full = "0.7.0"
nucleo-matcher = "0.3.1"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
streaming-iterator = "0.1.9"
tar = "0.4.46"
tokei = "12"
# Native math + mermaid rendering to self-contained SVG — no webview / no helper
# binary (replaces the old `clew-view` MathJax/mermaid.js path).
ratex-svg = { version = "0.1.13", features = ["standalone", "embed-fonts"] }
ratex-parser = "0.1.13"
ratex-layout = "0.1.13"
mermaid-rs-renderer = { version = "0.3", default-features = false }
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1.3"
tree-sitter = "0.26.11"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.26.11"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"
ureq = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

tree-sitter-dart-orchard = "0.5.0"

# Native AppKit access (macOS only): the window is frameless (decorations off)
# so clew draws its own controls; this restores the rounded window corners that
# a borderless window loses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[[bin]]
name = "clew"
path = "src/main.rs"
