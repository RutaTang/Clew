[package]
name = "clew"
version = "0.1.0"
edition = "2024"
# `clew-view` is a helper bin; make `cargo run` default to the main app.
default-run = "clew"

[dependencies]
flate2 = "1.1.9"
globset = "0.4.16"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
iced = { version = "0.14", features = ["advanced", "canvas", "markdown", "highlighter", "svg", "tokio"] }
ignore = "0.4.29"
lzma-rs = "0.3.0"
notify-debouncer-full = "0.7.0"
nucleo-matcher = "0.3.1"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
streaming-iterator = "0.1.9"
tar = "0.4.46"
tokei = "12"
# Native math + mermaid rendering to self-contained SVG — no webview / no helper
# binary (replaces the old `clew-view` MathJax/mermaid.js path).
ratex-svg = { version = "0.1.13", features = ["standalone", "embed-fonts"] }
ratex-parser = "0.1.13"
ratex-layout = "0.1.13"
mermaid-rs-renderer = { version = "0.3", default-features = false }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1.3"
tree-sitter = "0.26.11"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.26.11"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"
ureq = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Used only by the `clew-view` helper binary (src/bin/clew-view.rs), which
# renders an explanation page in clew's own embedded webview. The main `clew`
# binary does not link these.
tao = "0.34"
wry = "0.54"
tree-sitter-dart-orchard = "0.5.0"

# Native AppKit access (macOS only): the window is frameless (decorations off)
# so clew draws its own controls; this restores the rounded window corners that
# a borderless window loses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSResponder"] }

[[bin]]
name = "clew"
path = "src/main.rs"

[[bin]]
name = "clew-view"
path = "src/bin/clew-view.rs"
