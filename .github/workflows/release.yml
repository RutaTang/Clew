name: Release

# One tag-triggered release. It builds every artifact, then publishes them to a
# single GitHub Release for the tag:
#
#   - the macOS app: signed with a Developer ID, notarized (so it launches on
#     other Macs with no Gatekeeper prompt), packed into a drag-to-Applications
#     DMG.
#   - the headless clew-server for the Linux platforms a user might SSH into
#     (static musl, so one binary runs on any Linux). The client auto-deploys the
#     matching one to a remote — see crates/clew-core/src/server_dist.rs — so the
#     app and its server ship together, versioned together.
#
# The app job degrades gracefully: with no signing secrets it still produces an
# ad-hoc-signed DMG (fine locally, warns on other Macs). Configure these five
# repository secrets for full Developer ID signing + Apple notarization:
#
#   MACOS_CERTIFICATE           base64 of the "Developer ID Application" cert (.p12)
#   MACOS_CERTIFICATE_PASSWORD  password protecting that .p12
#   APPLE_ID                    the Apple ID email used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD an app-specific password for that Apple ID
#   APPLE_TEAM_ID               the 10-char Developer Team ID
#
# Export the .p12 from Keychain Access, then:  base64 -i cert.p12 | pbcopy
# The signing identity is auto-detected from the imported cert — no separate
# secret — and the temp CI keychain uses a random throwaway password.
on:
  push:
    tags: ['v*.*.*'] # semver tags only
  workflow_dispatch:

permissions:
  contents: write # publish the release

jobs:
  # macOS app -> signed, notarized DMG (uploaded as an artifact for `publish`).
  app:
    name: App · macOS
    runs-on: macos-14 # Apple Silicon, matching the shipped arm64 target
    env:
      # Mapped from secrets so steps can gate on them with `if: env.X != ''`
      # (secrets are not directly readable in `if:` conditions).
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A tag `v1.2.0` → marketing version `1.2.0`; the build number is the run
      # number. Off a tag (manual dispatch) fall back to the crate version.
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF#refs/tags/}"; V="${V#v}"
          else
            V="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "dmg=Clew-$V-arm64.dmg" >> "$GITHUB_OUTPUT"
          echo "Building version $V (build $GITHUB_RUN_NUMBER)"

      # Ad-hoc signed here; re-signed with the Developer ID below if secrets exist.
      - name: Build release app bundle
        run: scripts/build-app.sh --version "${{ steps.ver.outputs.version }}" --build "$GITHUB_RUN_NUMBER"

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/clew-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Make the temp keychain searchable so codesign can find the identity.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          # Auto-detect the Developer ID Application identity (its SHA-1 hash).
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/{print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No 'Developer ID Application' identity found in the cert." >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Detected signing identity: $IDENTITY"

      - name: Sign with Developer ID (hardened runtime)
        if: env.SIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          APP="dist/Clew.app"
          ENTITLEMENTS="assets/clew.entitlements"
          # Sign inner binaries first, then the bundle, so the outer signature
          # seals them.
          for target in \
            "$APP/Contents/MacOS/clew-server" \
            "$APP/Contents/MacOS/clew" \
            "$APP"; do
            codesign --force --timestamp --options runtime \
              --entitlements "$ENTITLEMENTS" \
              --sign "$SIGN_IDENTITY" "$target"
          done
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package DMG
        env:
          DMG_NAME: ${{ steps.ver.outputs.dmg }}
        run: |
          set -euo pipefail
          DMG="dist/$DMG_NAME"
          # Stage the app beside an /Applications symlink so the mounted volume
          # offers the familiar drag-Clew-onto-Applications install.
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          ditto dist/Clew.app "$STAGE/Clew.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Clew" -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"
          # Sign the DMG too when we have an identity (recommended before notarizing).
          if [[ -n "${SIGN_IDENTITY:-}" ]]; then
            codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
          fi

      - name: Notarize & staple
        if: env.SIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          set -euo pipefail
          DMG="dist/${{ steps.ver.outputs.dmg }}"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.dmg }}
          path: dist/${{ steps.ver.outputs.dmg }}
          if-no-files-found: error

  # Headless clew-server for the Linux remotes the client can auto-deploy to.
  # Static musl, so one binary per arch runs on any Linux. Remote macOS is not
  # supported yet, so no darwin targets.
  server:
    name: Server · ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - slug: linux-aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl-gcc, so the tree-sitter (C) grammars and ring compile against musl
      # and the whole binary links fully static.
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build clew-server (static musl)
        env:
          TARGET: ${{ matrix.target }}
          SLUG: ${{ matrix.slug }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          cargo build --release --locked -p clew-server --target "$TARGET"
          install -m755 "target/$TARGET/release/clew-server" "clew-server-$SLUG"
          file "clew-server-$SLUG"

      - uses: actions/upload-artifact@v4
        with:
          name: clew-server-${{ matrix.slug }}
          path: clew-server-${{ matrix.slug }}
          if-no-files-found: error

  # One release for the tag, holding the DMG and every server binary. Only on a
  # tag push (a manual dispatch just builds, as a dry run).
  publish:
    name: Publish the release
    needs: [app, server]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach all assets to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
