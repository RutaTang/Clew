name: CI

# Build + test on every push and PR. The GUI client (`clew`) has macOS-only
# dependencies (objc2/AppKit), so the full workspace is built on macOS; the
# headless backend (`clew-server` + `clew-core` + `clew-protocol`) is the piece
# deployed to remote hosts over SSH, so it is also built and tested on Linux.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos:
    name: Build & test · macOS · full workspace
    runs-on: macos-14 # Apple Silicon, matching the shipped arm64 target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets --locked
      - name: Test (workspace)
        run: cargo test --workspace --locked

  linux-server:
    name: Build & test · Linux · headless server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Only the backend crates — the `clew` GUI package is never selected, so its
      # macOS-only dependencies are not resolved for the Linux build.
      - name: Build (server + core + protocol)
        run: cargo build -p clew-server --all-targets --locked
      - name: Test (server + core + protocol)
        run: cargo test -p clew-server -p clew-core -p clew-protocol --locked

  lint:
    name: Lint · clippy + rustfmt
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # A hard gate. The tree is clean at `-D warnings`, and the lints that
      # caught real defects here (unused results, large Err variants, silently
      # ignored Results) are exactly the ones an advisory job lets through.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  # The protocol is a contract between two separately-deployed binaries, and a
  # wire change that forgets its version bump does not fail to compile — it
  # fails at runtime, as frames that silently do not deserialize. This job is
  # what turns that into a red PR.
  protocol-contract:
    name: Protocol · contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The snapshot's filename carries PROTOCOL_VERSION, so a wire change
      # either matches the committed snapshot or forces a bump.
      - name: Wire snapshot
        run: cargo test -p clew-protocol --locked
      - name: A snapshot exists for the declared protocol version
        run: |
          set -euo pipefail
          PROTO=$(sed -n 's/^pub const PROTOCOL_VERSION: u32 = \([0-9]*\);$/\1/p' crates/clew-protocol/src/lib.rs)
          test -n "$PROTO" # the constant must parse — the release asset name uses it too
          SNAP="crates/clew-protocol/tests/snapshots/wire-v$PROTO.snap"
          test -f "$SNAP" || {
            echo "::error::no $SNAP — regenerate with UPDATE_WIRE_SNAPSHOT=1 cargo test -p clew-protocol"
            exit 1
          }
          echo "protocol v$PROTO has a committed wire snapshot"
