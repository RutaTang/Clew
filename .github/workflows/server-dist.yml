name: Server dist

# Build and publish the headless clew-server for the platforms a user might SSH
# into, so the client can auto-deploy it to a remote host (see
# crates/clew-core/src/server_dist.rs). Versioned with the app: assets are named
# `clew-server-<slug>` (the slug the remote's `uname -sm` resolves to) and
# attached to the same `v<version>` release as the app, so a client fetches the
# server built alongside it (a patch ships to remotes with the client update).
# Runs automatically on each release tag; can also be re-run by hand.
#
# Linux only for now (remote macOS is not supported). The binaries are static
# musl builds, so one `linux-x86_64` binary runs on any x86_64 Linux (glibc or
# musl, new or old) with no runtime dependencies.
on:
  push:
    # Same semver tags that cut an app release, so the release that ships the app
    # also carries the matching server binaries (versioned together).
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish server binaries to, e.g. v0.1.3
        required: true

permissions:
  contents: write # attach binaries to the app release

jobs:
  build:
    name: clew-server · ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - slug: linux-aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      # Build from the tag being released (or the dispatch input), so the binary
      # matches the version of the release it lands in.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl-gcc, so the tree-sitter (C) grammars and ring compile against musl
      # and the whole binary links fully static.
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build clew-server (static musl)
        env:
          TARGET: ${{ matrix.target }}
          SLUG: ${{ matrix.slug }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          cargo build --release --locked -p clew-server --target "$TARGET"
          install -m755 "target/$TARGET/release/clew-server" "clew-server-$SLUG"
          file "clew-server-$SLUG"

      - uses: actions/upload-artifact@v4
        with:
          name: clew-server-${{ matrix.slug }}
          path: clew-server-${{ matrix.slug }}
          if-no-files-found: error

  publish:
    name: Attach to the app release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The client fetches from `.../v<version>/clew-server-<slug>`, so the target
      # is the app's own release tag: the pushed tag, or the dispatch input.
      - name: Resolve target tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v*.*.*) ;;
            *) echo "::error::Refusing to publish to non-release tag '$TAG'"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Attaching server binaries to release $TAG"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach server binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The app release (release.yml) normally creates this tag's release;
          # create it if this job gets there first (tolerate a concurrent create),
          # then attach the server binaries beside the DMG.
          gh release create "$TAG" --title "Clew ${TAG#v}" --generate-notes 2>/dev/null || true
          gh release upload "$TAG" dist/clew-server-* --clobber
          echo "Server assets on $TAG:"
          gh release view "$TAG" --json assets -q '.assets[].name'
