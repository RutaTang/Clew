[package]
name = "clew-speak"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Clew's offline speech: text read aloud by an on-device model, in a process of its own."

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# sherpa-onnx's ONNX Runtime, linked statically where its prebuilt archive
# is built against the C runtime the rest of the program uses. Windows's is
# built against the static one (`/MT`) where Rust links the DLL, so there it
# is the library's own DLLs, shipped beside this program.
[target.'cfg(not(windows))'.dependencies]
sherpa-onnx = "=2.0.1"

[target.'cfg(windows)'.dependencies]
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["shared"] }
