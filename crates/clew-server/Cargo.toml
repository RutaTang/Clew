# clew-server: the headless backend. Speaks clew-protocol over stdio, so the
# client can run it as a local child process or over SSH on a remote host with
# no client-side difference. All OS/filesystem interaction lives here.
[package]
name = "clew-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
# DBGp (Xdebug's debugging protocol, `php-debug`) carries values in base64.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clew-core = { path = "../clew-core" }
clew-protocol = { path = "../clew-protocol" }
notify-debouncer-full = "0.7.0"
# Reads DBGp's XML replies (`php-debug`): small, read-only, no dependencies.
roxmltree = "0.20.0"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
# Parses `.clew/*.toml` state before a wholesale write may replace it.
toml = "1.1.3"

[lib]
name = "clew_server"
path = "src/lib.rs"

[[bin]]
name = "clew-server"
path = "src/main.rs"
