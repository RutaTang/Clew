# clew-core: backend logic shared by the `clew` GUI client and the headless
# `clew-server`. Pure computation over the filesystem (scan, search, …) with no
# GUI and no protocol types, so both the in-process server and the remote
# server binary can depend on it.
[package]
name = "clew-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
clew-protocol = { path = "../clew-protocol" }
libc = "0.2"
# LSP server provisioning: download + unpack pinned language-server binaries.
flate2 = "1.1.9"
lzma-rs = "0.3.0"
tar = "0.4.46"
tokei = "12"
toml = "1.1.3"
# HTTP/1.1 for every request clew-core makes. ureq writes the requests and
# reads the responses; net.rs makes every connection they travel on — its
# name lookup, TCP, proxy and TLS — through ureq's connector API, so it can
# meter, bound and shut down each one. That API lives in `ureq::unversioned`,
# which ureq keeps outside semver: pinned exactly, so no update can change it
# unseen. No default features: TLS, SOCKS and the proxy decision are net.rs's
# own, so ureq carries none of its own; gzip, which ureq 2's defaults had on
# (flate2 is a dependency here anyway).
ureq = { version = "=3.4.2", default-features = false, features = ["gzip"] }
# The Basic credentials of an http proxy (net.rs). The build ureq itself uses.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
# ureq's HTTP/1.1 parser, the build ureq itself uses: net.rs follows an
# answer's head as far as a TLS session that ends under it needs, and reads
# it with the parser ureq reads it with, so the two cannot disagree on where
# it ends or what it says (`net::answer_head`).
httparse = { version = "1.10.1", default-features = false }
# A connect that an abandoned request can give up in the middle (net.rs
# `connect_to`): std only connects with a timeout nothing can cut short.
socket2 = "0.6"
# The WHATWG URL parser: every decision about a URL (net.rs) is made on its
# reading, and ureq is handed its serialization of the URL, checked to name
# the same host and port under ureq's own parser (`net::request_uri`).
url = "2.5"
# TLS for every connection (net.rs), to a target and to an `https://` proxy
# alike: rustls with ring, the one TLS stack in the build, trusting the
# bundled Mozilla roots plus the OS store, so a private/corporate CA works
# without breaking hosts that have no CA bundle.
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
globset = "0.4.16"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
streaming-iterator = "0.1.9"
tokio = { version = "1.52.3", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
# Tokenizer: tree-sitter grammars for syntax highlighting + outline tags.
tree-sitter = "0.26.11"
tree-sitter-highlight = "0.26.11"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart-orchard = "0.5.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"

# The system proxy settings (net.rs `system_proxies`): what System Settings ›
# Network › Proxies configures, read with `SCDynamicStoreCopyProxies` when no
# proxy variable is set. The binding reqwest/hyper-util read it through; its
# CoreFoundation crate is already in the build.
[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.8"
