# Clew's plugin system, free of any UI: plugin.toml, reading a plugin's file,
# the approvals and approved copies, building a plugin from its source, and
# (feature `runtime`) running plugins with wasmtime. See docs/plugins.md.
#
# `clew` uses all of it; `clew-server` the rest without `runtime`, so a
# remote host never links wasmtime for its agents' authoring tools.
[package]
name = "clew-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
default = ["runtime"]
runtime = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:tokio", "dep:bytes"]

[dependencies]
clew-core = { path = "../clew-core" }
clew-rules = { path = "../clew-rules" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
toml = "1.1.3"
# Clew's own reading of a plugin's files as Rust, when the compiler stopped
# before it said what it read and its words are not passed on: where the
# code does not parse, in words made of the plugin's own code only.
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
# What wasmtime itself reads components with (the same version, so one copy).
wasmparser = "0.254.1"
# wasmtime 48: the newest whose MSRV (1.95) is the workspace's toolchain.
# Cranelift compiles; the component model is the plugin ABI; no WAT, no GC
# proposals, no profiling or debugging support compiled in.
wasmtime = { version = "=48.0.9", optional = true, default-features = false, features = ["cranelift", "component-model", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "=48.0.9", optional = true, default-features = false, features = ["p2"] }
# The `AsyncWrite` a plugin's standard output is captured through, and the
# waits of its clock (`runtime::RunClock`).
tokio = { version = "1.52.3", optional = true, default-features = false, features = ["time", "rt"] }
# What WASI hands a write to standard output as (`runtime::Capture`), the
# version wasmtime-wasi uses.
bytes = { version = "1.12.1", optional = true, default-features = false }
