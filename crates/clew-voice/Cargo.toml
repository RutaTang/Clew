[package]
name = "clew-voice"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
# What `clew-speak` answers: JSON lines, its audio in base64.
base64 = "0.22.1"
# The wake phrase model comes as a `.tar.bz2` (pure Rust bzip2).
bzip2 = "0.6.1"
cpal = "0.18.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.11"
sha2 = "0.11"
# Echo cancellation (WebRTC's AEC3, in Rust): what Clew says, taken back out
# of what the microphone hears, so the reader can talk over it.
sonora = "0.3.0"
tar = "0.4.46"
whisper-rs = "0.16.0"

# whisper.cpp on the GPU where every machine has one: Metal on macOS (Apple
# Silicon and recent Intel Macs alike; the shader library is embedded, so no
# Metal compiler is needed to build). Elsewhere it runs on the CPU, which
# the models Clew offers first need no more than a moment of.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
